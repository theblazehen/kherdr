name: Build Kindle package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kindle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '4'
      MISE_YES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev build-essential pkg-config cmake ninja-build libssl-dev zstd
      - uses: jdx/mise-action@v2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/kherdr-release
          key: kindle-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/release.py', 'tools/build-local-herdr.py', 'mise.toml') }}
          restore-keys: kindle-inputs-${{ runner.os }}-
      - name: Build, test, and package
        run: mise run release
      - name: Upload installable package and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: kherdr-kindle
          path: |
            dist/*.kpkg
            dist/*-source.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kherdr-kindle
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.kpkg
            dist/*-source.tar.gz
