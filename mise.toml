[tools]
zig = "0.15.2"
rust = "1.92.0"

[tasks.build-probe]
description = "Cross-build feasibility probe in Crabbox (pass explicit source/toolchain/work paths)"
run = 'uv run --python 3.12 python tools/build-probe.py "$@"'

[tasks.build-rust]
description = "Cross-build Rust/Slint in Crabbox (explicit toolchain/work paths; optional --bin)"
run = 'uv run --python 3.12 python tools/build-rust.py "$@"'

[tasks.package]
description = "Build a credential-free KPM release artifact from exact binary/build-receipt/license inputs"
run = 'uv run --python 3.12 python tools/package-rust.py "$@"'

[tasks.paper-export]
description = "Build and resolve native editable UI scenes inside Crabbox (explicit --work and --fonts)"
run = 'mise exec rust@1.96.1 zig@0.15.2 -- uv run --python 3.12 python tools/slint-paper/export.py "$@"'

[tasks.paper-import]
description = "Import resolved scenes into new native Paper artboards on this desktop (explicit --file)"
run = 'bun tools/slint-paper/import.mjs "$@"'

[tasks.release]
description = "Build and verify the Kindle package and corresponding source archive"
run = 'uv run --python 3.12 python tools/release.py "$@"'
